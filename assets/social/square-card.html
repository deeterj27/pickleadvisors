<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:1200px;overflow:hidden}body{position:relative;display:grid;place-items:center;background:#087b36;border:36px solid #10110f}.texture{position:absolute;inset:0;background-image:radial-gradient(rgba(255,253,247,.18) 1.1px,transparent 1.1px);background-size:15px 15px}.mark{position:relative;width:860px;height:860px;display:grid;place-items:center;border:12px solid #fffdf7}.letter{font-family:Georgia,serif;font-size:640px;font-weight:700;line-height:.8;color:#fffdf7;transform:translateY(-18px)}.rule{position:absolute;left:115px;right:115px;bottom:126px;height:34px;background:#b8ff38}.label{position:absolute;bottom:65px;font-family:Arial,sans-serif;font-size:32px;font-weight:700;letter-spacing:.24em;color:#b8ff38;text-transform:uppercase}
</style>
</head>
<body><div class="texture"></div><div class="mark"><div class="letter">P</div><div class="rule"></div><div class="label">Pickle Advisors</div></div></body>
</html>
