<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face{font-family:Archivo;src:url('/assets/fonts/archivo-700.woff2') format('woff2');font-weight:700}
@font-face{font-family:Space;src:url('/assets/fonts/space-grotesk-700.woff2') format('woff2');font-weight:700}
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}body{background:#e8ded0;color:#10110f;font-family:Archivo,Arial,sans-serif;background-image:radial-gradient(rgba(80,73,63,.16) .7px,transparent .7px);background-size:7px 7px;border:4px solid #10110f}.masthead{height:82px;border-bottom:2px solid #10110f;display:flex;align-items:stretch}.brand{width:310px;background:#087b36;color:#fffdf7;display:flex;align-items:center;padding:0 34px;gap:14px}.brand strong{font-family:Georgia,serif;font-size:35px;letter-spacing:.02em}.brand span{font-family:Space,Arial,sans-serif;font-size:11px;letter-spacing:.17em;color:#b8ff38}.masthead-tail{flex:1}.content{height:544px;display:grid;grid-template-columns:1.45fr .8fr}.message{padding:50px 60px 44px 64px;border-right:2px solid #10110f;display:flex;flex-direction:column}.kicker{margin:0 0 22px;color:#087b36;font-family:Space,Arial,sans-serif;font-size:15px;letter-spacing:.16em;text-transform:uppercase}.message h1{margin:0;max-width:700px;font-family:Georgia,serif;font-size:72px;line-height:.92;letter-spacing:-.045em}.message h1 strong{font-weight:inherit;background:linear-gradient(transparent 79%,#b8ff38 0)}.message footer{margin-top:auto;padding-top:22px;border-top:2px solid #10110f;color:#625f57;font-size:17px;line-height:1.35}.businesses{padding:44px 42px 42px;display:grid;grid-template-rows:repeat(3,1fr);gap:14px}.business{position:relative;border:2px solid #10110f;background:#fffdf7;padding:20px 22px;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;column-gap:16px}.business .num,.business .verb,.business .status{font-family:Space,Arial,sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#087b36}.business .verb{text-align:right}.business h2{grid-column:1/-1;align-self:end;margin:0 0 4px;font-family:Georgia,serif;font-size:28px;line-height:1}.business .status{grid-column:1/-1;color:#625f57;letter-spacing:.08em}.business:last-child .status{color:#087b36}
</style>
</head>
<body>
<div class="masthead"><div class="brand"><strong>PICKLE</strong><span>ADVISORS</span></div><div class="masthead-tail"></div></div>
<div class="content">
  <section class="message">
    <p class="kicker">Your Brand's Operating System</p>
    <h1>Build a stronger consumer brand, <strong>without more chaos.</strong></h1>
    <footer>Practical AI advisory · Independent market intelligence · Future selective capital</footer>
  </section>
  <aside class="businesses">
    <div class="business"><span class="num">01</span><span class="verb">Build</span><h2>Pickle Advisors</h2><span class="status">Available now</span></div>
    <div class="business"><span class="num">02</span><span class="verb">Cover</span><h2>Deet's Eats</h2><span class="status">Publishing now</span></div>
    <div class="business"><span class="num">03</span><span class="verb">Back</span><h2>Pickle VC</h2><span class="status">Coming soon</span></div>
  </aside>
</div>
</body>
</html>
