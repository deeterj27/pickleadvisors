name: Check and publish site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - name: Build the shared templates
        run: python scripts/build_site.py
      - name: Content, accessibility structure, links, metadata, and no-emoji checks
        run: python -m unittest discover -p 'test_*.py'
      - name: Audit validation and submission state tests
        run: node --test tests/*.test.cjs
      - name: Check reproducibility
        run: python scripts/build_site.py --check
      - run: python scripts/package_site.py
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only after all checks pass
        id: deployment
        uses: actions/deploy-pages@v4
