name: Check and publish site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - name: Refresh newsletter on daily and manual runs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/refresh_newsletter.py
      - name: Build the shared templates
        run: python scripts/build_site.py
      - name: Content, accessibility structure, links, metadata, and no-emoji checks
        run: python -m unittest discover -p 'test_*.py'
      - name: Audit validation and submission state tests
        run: node --test tests/*.test.cjs
      - name: Check reproducibility
        run: python scripts/build_site.py --check
      - name: Save a validated newsletter snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git add content/newsletter.json pickle-assets/ index.html advisory/index.html media/index.html about/index.html audit/index.html sitemap.xml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh newsletter selection from public RSS"
            git push origin HEAD:main
          fi
      - run: python scripts/package_site.py
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only after all checks pass
        id: deployment
        uses: actions/deploy-pages@v4
